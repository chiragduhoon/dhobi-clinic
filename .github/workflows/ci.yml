name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend rule tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dhobi-clinic-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  admin:
    name: Admin dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dhobi-clinic-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
